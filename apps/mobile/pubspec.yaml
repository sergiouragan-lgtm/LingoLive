name: lingolive_mobile
description: Aplicação móvel LingoLIVE IA — atividades de aprendizagem, progresso e faturação.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_messaging: ^15.1.3
  firebase_crashlytics: ^4.1.3
  cloud_firestore: ^5.4.4
  flutter_local_notifications: ^17.2.3
  record: ^6.2.1
  path_provider: ^2.1.4
  app_links: ^6.3.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
