# Cloud Logging Configuration
# Deploy with: gcloud logging log-groups create lingolive --description="LingoLive App Logs"

log_queries:
  stripe_webhooks:
    filter: |
      resource.type="cloud_run_revision"
      resource.labels.service_name="lingolive-server-*"
      jsonPayload.message=~"Stripe Webhook.*"
    severity_min: "ERROR"
    display_name: "Stripe Webhook Errors"
    description: "Track Stripe webhook processing failures"

  stripe_webhook_success:
    filter: |
      resource.type="cloud_run_revision"
      resource.labels.service_name="lingolive-server-*"
      jsonPayload.message=~"Stripe Webhook.*processed successfully"
    display_name: "Stripe Webhook Success"

  openai_errors:
    filter: |
      resource.type="cloud_run_revision"
      jsonPayload.message=~"OpenAI.*Error"
      severity="ERROR"
    display_name: "OpenAI API Errors"

  livekit_failures:
    filter: |
      resource.type="cloud_run_revision"
      jsonPayload.message=~"LiveKit.*Error"
      severity="ERROR"
    display_name: "LiveKit Connection Failures"

  database_slow_queries:
    filter: |
      resource.type="cloudsql_database"
      metric.type="cloudsql.googleapis.com/database/mysql/queries"
      metric.value > 1000
    display_name: "Slow Database Queries"

  auth_failures:
    filter: |
      resource.type="cloud_run_revision"
      jsonPayload.message=~".*Unauthorized.*"
      severity="WARNING"
    display_name: "Authentication Failures"

  payment_processing:
    filter: |
      resource.type="cloud_run_revision"
      jsonPayload.message=~"\[Payment.*\].*Processing"
    display_name: "Payment Processing Events"
