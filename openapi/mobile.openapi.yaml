{
  "openapi": "3.1.0",
  "info": {
    "title": "LingoLIVE Mobile API",
    "version": "1.0.0",
    "description": "Contrato canónico consumido pela aplicação Flutter. Os eventos de conclusão são idempotentes e o backend é a única autoridade para XP, memória e progresso."
  },
  "servers": [
    { "url": "https://lingolive-ai-floqa5xrja-uw.a.run.app", "description": "Produção" }
  ],
  "security": [{ "firebaseBearer": [] }],
  "paths": {
    "/api/quizzes/generate": {
      "post": {
        "operationId": "generateAdaptiveQuiz",
        "summary": "Cria um quiz adaptativo autenticado",
        "requestBody": {
          "required": true,
          "content": { "application/json": { "schema": {
            "type": "object",
            "additionalProperties": false,
            "required": ["language"],
            "properties": {
              "language": { "type": "string", "minLength": 1, "maxLength": 40 },
              "level": { "$ref": "#/components/schemas/CefrLevel" },
              "ageGroup": { "type": "string", "maxLength": 20 },
              "grade": { "type": "string", "maxLength": 30 }
            }
          } } }
        },
        "responses": {
          "201": { "description": "Sessão criada sem expor respostas corretas", "content": { "application/json": { "schema": {
            "type": "object", "required": ["sessionId", "questions"],
            "properties": {
              "sessionId": { "type": "string" },
              "questions": { "type": "array", "minItems": 1, "items": { "$ref": "#/components/schemas/QuizQuestion" } }
            }
          } } } },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "429": { "$ref": "#/components/responses/RateLimited" },
          "503": { "$ref": "#/components/responses/Unavailable" }
        }
      }
    },
    "/api/quizzes/{sessionId}/submit": {
      "post": {
        "operationId": "submitQuiz",
        "summary": "Corrige o quiz e regista uma conclusão canónica",
        "description": "Operação idempotente: repetir o mesmo sessionId devolve o recibo existente e não atribui XP novamente.",
        "parameters": [{ "$ref": "#/components/parameters/SessionId" }],
        "requestBody": { "required": true, "content": { "application/json": { "schema": {
          "type": "object", "additionalProperties": false, "required": ["answers", "durationMinutes"],
          "properties": {
            "answers": { "type": "array", "items": { "type": "integer", "minimum": 0 } },
            "durationMinutes": { "type": "number", "minimum": 0 }
          }
        } } } },
        "responses": {
          "200": { "description": "Conclusão nova ou repetida", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/QuizResult" } } } },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "409": { "$ref": "#/components/responses/Conflict" },
          "410": { "$ref": "#/components/responses/Gone" },
          "429": { "$ref": "#/components/responses/RateLimited" },
          "503": { "$ref": "#/components/responses/Unavailable" }
        }
      }
    },
    "/api/learning/progress": {
      "get": {
        "operationId": "getLearningProgress",
        "summary": "Obtém o agregado canónico de progresso",
        "responses": {
          "200": { "description": "Progresso do utilizador autenticado", "content": { "application/json": { "schema": {
            "type": "object", "required": ["progress"], "properties": { "progress": { "$ref": "#/components/schemas/LearningProgress" } }
          } } } },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "500": { "$ref": "#/components/responses/InternalError" },
          "503": { "$ref": "#/components/responses/Unavailable" }
        }
      }
    },
    "/api/learning/flashcard-sessions/{sessionId}/complete": {
      "post": {
        "operationId": "completeFlashcardSession",
        "summary": "Conclui uma sessão real de flashcards",
        "description": "sessionId é a chave idempotente. Uma repetição não duplica XP nem progresso.",
        "parameters": [{ "$ref": "#/components/parameters/SessionId" }],
        "requestBody": { "required": true, "content": { "application/json": { "schema": {
          "type": "object", "additionalProperties": false,
          "required": ["sessionId", "language", "durationMinutes", "ratings"],
          "properties": {
            "sessionId": { "type": "string" },
            "language": { "type": "string", "minLength": 1, "maxLength": 40 },
            "durationMinutes": { "type": "number", "minimum": 0 },
            "ratings": { "type": "array", "minItems": 1, "items": { "$ref": "#/components/schemas/FlashcardRating" } }
          }
        } } } },
        "responses": {
          "200": { "description": "Sessão já processada", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/PracticeCompletion" } } } },
          "201": { "description": "Sessão processada", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/PracticeCompletion" } } } },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "409": { "$ref": "#/components/responses/Conflict" },
          "503": { "$ref": "#/components/responses/Unavailable" }
        }
      }
    },
    "/api/pronunciation/evaluate": {
      "post": {
        "operationId": "evaluatePronunciation",
        "summary": "Avalia áudio e conclui a atividade de pronúncia",
        "description": "attemptId é a chave idempotente. Aceita base64 puro ou data URI; o Flutter envia WAV em base64 puro.",
        "requestBody": { "required": true, "content": { "application/json": { "schema": {
          "type": "object", "additionalProperties": false,
          "required": ["attemptId", "targetText", "language", "mimeType", "audioBase64", "durationMinutes"],
          "properties": {
            "attemptId": { "type": "string", "pattern": "^[A-Za-z0-9_-]{8,80}$" },
            "targetText": { "type": "string", "minLength": 1 },
            "language": { "type": "string", "minLength": 1 },
            "mimeType": { "type": "string", "enum": ["audio/wav", "audio/webm", "audio/mpeg", "audio/mp4", "audio/ogg"] },
            "audioBase64": { "type": "string", "minLength": 1, "contentEncoding": "base64" },
            "durationMinutes": { "type": "number", "minimum": 0 }
          }
        } } } },
        "responses": {
          "200": { "description": "Tentativa já processada", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/PronunciationResult" } } } },
          "201": { "description": "Tentativa avaliada e processada", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/PronunciationResult" } } } },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "409": { "$ref": "#/components/responses/Conflict" },
          "503": { "$ref": "#/components/responses/Unavailable" }
        }
      }
    },
    "/api/school/mobile-context": {
      "get": {
        "operationId": "getMobileSchoolContext",
        "summary": "Autoriza a área escolar usando apenas custom claims",
        "responses": {
          "200": { "description": "Contexto institucional autorizado", "content": { "application/json": { "schema": {
            "type": "object", "required": ["role", "schoolId", "tenantId"],
            "properties": {
              "role": { "type": "string", "enum": ["school_admin", "org_admin", "admin", "super_admin"] },
              "schoolId": { "type": ["string", "null"] },
              "tenantId": { "type": ["string", "null"] }
            }
          } } } },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" }
        }
      }
    },
    "/api/create-checkout-session": {
      "post": {
        "operationId": "createCheckoutSession",
        "summary": "Cria checkout Stripe para um plano permitido",
        "requestBody": { "required": true, "content": { "application/json": { "schema": {
          "type": "object", "additionalProperties": false, "required": ["planId"],
          "properties": {
            "planId": { "type": "string", "minLength": 1 },
            "client": { "type": "string", "enum": ["mobile", "web"] }
          }
        } } } },
        "responses": {
          "200": { "description": "Checkout criado", "content": { "application/json": { "schema": {
            "type": "object", "required": ["url"], "properties": { "url": { "type": "string", "format": "uri", "pattern": "^https://" } }
          } } } },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "429": { "$ref": "#/components/responses/RateLimited" },
          "500": { "$ref": "#/components/responses/InternalError" }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "firebaseBearer": { "type": "http", "scheme": "bearer", "bearerFormat": "Firebase ID token" }
    },
    "parameters": {
      "SessionId": { "name": "sessionId", "in": "path", "required": true, "schema": { "type": "string", "minLength": 1 } }
    },
    "schemas": {
      "CefrLevel": { "type": "string", "enum": ["A1", "A2", "B1", "B2", "C1", "C2"] },
      "Error": { "type": "object", "required": ["error"], "properties": { "error": { "type": "string" } }, "additionalProperties": true },
      "QuizQuestion": {
        "type": "object", "required": ["id", "question", "options", "skill", "difficulty"],
        "properties": {
          "id": { "type": "string" }, "question": { "type": "string" },
          "options": { "type": "array", "minItems": 4, "maxItems": 4, "items": { "type": "string" } },
          "skill": { "type": "string" }, "difficulty": { "type": "string" }
        }
      },
      "QuizResult": {
        "type": "object", "required": ["score", "correctAnswers", "totalQuestions", "xpAwarded", "newTotalXp", "results"],
        "properties": {
          "score": { "type": "integer" }, "correctAnswers": { "type": "integer" }, "totalQuestions": { "type": "integer" },
          "xpAwarded": { "type": "integer", "minimum": 0 }, "newTotalXp": { "type": "integer", "minimum": 0 },
          "duplicated": { "type": "boolean" }, "duplicate": { "type": "boolean" }, "results": { "type": "array", "items": { "type": "object" } }
        }
      },
      "FlashcardRating": {
        "type": "object", "required": ["cardId", "word", "rating"],
        "properties": {
          "cardId": { "type": "string" }, "word": { "type": "string" },
          "rating": { "type": "string", "enum": ["known", "learning"] }
        }
      },
      "PracticeCompletion": {
        "type": "object", "required": ["duplicate", "xpAwarded"],
        "properties": {
          "duplicate": { "type": "boolean" }, "xpAwarded": { "type": "integer", "minimum": 0 },
          "newTotalXp": { "type": "integer", "minimum": 0 }, "eventId": { "type": "string" }
        }, "additionalProperties": true
      },
      "LearningProgress": {
        "type": "object",
        "properties": {
          "totalActivities": { "type": "integer", "minimum": 0 }, "totalMinutes": { "type": "number", "minimum": 0 },
          "completedByType": { "type": "object", "additionalProperties": { "type": "integer", "minimum": 0 } },
          "skills": { "type": "object", "additionalProperties": true }
        }, "additionalProperties": true
      },
      "PronunciationResult": {
        "allOf": [
          { "$ref": "#/components/schemas/PracticeCompletion" },
          { "type": "object", "required": ["id", "targetText", "transcription", "overallScore", "accuracyScore", "fluencyScore", "completenessScore"],
            "properties": {
              "id": { "type": "string" }, "userId": { "type": "string" }, "targetText": { "type": "string" }, "transcription": { "type": "string" },
              "overallScore": { "type": "integer", "minimum": 0, "maximum": 100 }, "accuracyScore": { "type": "integer", "minimum": 0, "maximum": 100 },
              "fluencyScore": { "type": "integer", "minimum": 0, "maximum": 100 }, "completenessScore": { "type": "integer", "minimum": 0, "maximum": 100 },
              "timestamp": { "type": "string", "format": "date-time" }
            }, "additionalProperties": true }
        ]
      }
    },
    "responses": {
      "BadRequest": { "description": "Pedido inválido", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
      "Unauthorized": { "description": "Firebase ID token ausente ou inválido", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
      "Forbidden": { "description": "Claims sem autorização", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
      "NotFound": { "description": "Recurso inexistente", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
      "Conflict": { "description": "Colisão idempotente ou conflito de integridade", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
      "Gone": { "description": "Sessão expirada", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
      "RateLimited": { "description": "Limite excedido", "headers": { "Retry-After": { "schema": { "type": "integer" } } }, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
      "InternalError": { "description": "Falha interna", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
      "Unavailable": { "description": "Dependência ou persistência indisponível", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } }
    }
  }
}
