name: Bug report
description: Report a reproducible LingoLive regression
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest reliable sequence of steps.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or version
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Remove secrets and personal data before attaching evidence.
