name: Deploy to Production

on:
  push:
    branches: [main, claude/continue-previous-work-xogmfi]
  pull_request:
    branches: [main]

env:
  REGISTRY: us-central1-docker.pkg.dev
  PROJECT_ID: lingolive-ia-f5778
  IMAGE_NAME: lingolive
  SERVICE_NAME: lingolive-api

jobs:
  test:
    name: Test & Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type checking
        run: npm run typecheck

      - name: Linting
        run: npm run lint
        continue-on-error: true

      - name: Unit tests
        run: npm run test:ci

      - name: Test coverage
        run: npm run test:coverage
        continue-on-error: true

      - name: Security audit
        run: npm audit --omit=dev
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage-final.json
          fail_ci_if_error: false

  build:
    name: Build Docker Image
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGISTRY }}

      - name: Build Docker image
        run: |
          docker build \
            --tag ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/images/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --tag ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/images/${{ env.IMAGE_NAME }}:latest \
            .

      - name: Push Docker image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/images/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/images/${{ env.IMAGE_NAME }}:latest

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/images/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: cyclonedx-json

  security-scan:
    name: Security Scanning
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    timeout-minutes: 15

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Run Vulnerability Scanning
        run: |
          gcloud container images scan ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/images/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy-staging:
    name: Deploy to Staging
    needs: [test, build, security-scan]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/claude/continue-previous-work-xogmfi'
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Deploy to Cloud Run (Staging)
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }}-staging \
            --image=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/images/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --platform=managed \
            --region=us-central1 \
            --allow-unauthenticated \
            --memory=2Gi \
            --cpu=2 \
            --timeout=900 \
            --max-instances=10 \
            --set-env-vars=NODE_ENV=staging,LOG_LEVEL=debug

      - name: Notify Slack (Staging Deployment)
        uses: slackapi/slack-github-action@v1.24.0
        if: always()
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "Staging deployment for LingoLive",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Staging Deployment* ${{ job.status }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
                  }
                }
              ]
            }

  deploy-production:
    name: Deploy to Production
    needs: [test, build, security-scan]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 30
    environment:
      name: production
      url: https://api.lingolive.com

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Deploy to Cloud Run (Canary - 5%)
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/images/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --platform=managed \
            --region=us-central1 \
            --allow-unauthenticated \
            --memory=2Gi \
            --cpu=2 \
            --timeout=900 \
            --max-instances=50 \
            --min-instances=5 \
            --set-env-vars=NODE_ENV=production,LOG_LEVEL=info \
            --traffic=LATEST=5,CURRENT=95

      - name: Wait for canary health
        run: |
          echo "⏳ Monitoring canary deployment for 5 minutes..."
          sleep 300

      - name: Promote to production (25%)
        run: |
          gcloud run update-traffic ${{ env.SERVICE_NAME }} \
            --platform=managed \
            --region=us-central1 \
            --to-revisions=LATEST=25,CURRENT=75

      - name: Wait and promote further (50%)
        run: |
          sleep 300
          gcloud run update-traffic ${{ env.SERVICE_NAME }} \
            --platform=managed \
            --region=us-central1 \
            --to-revisions=LATEST=50,CURRENT=50

      - name: Final promotion (100%)
        run: |
          sleep 300
          gcloud run update-traffic ${{ env.SERVICE_NAME }} \
            --platform=managed \
            --region=us-central1 \
            --to-revisions=LATEST=100

      - name: Verify production deployment
        run: |
          echo "🚀 Production deployment complete"
          gcloud run describe ${{ env.SERVICE_NAME }} \
            --platform=managed \
            --region=us-central1 \
            --format='value(status.url)'

      - name: Notify Slack (Production)
        uses: slackapi/slack-github-action@v1.24.0
        if: always()
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "Production deployment for LingoLive",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Production Deployment* ${{ job.status }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
                  }
                }
              ]
            }

  notify-success:
    name: Notify on Success
    needs: [test, build]
    runs-on: ubuntu-latest
    if: always() && success()

    steps:
      - name: Send success notification
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ All checks passed! Ready for deployment.'
            })
