name: LingoLIVE DevSecOps Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  security-events: write

jobs:
  # 1. Security & Quality Scan
  security_scans:
    name: Security & Quality Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Detection (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true

      - name: SonarQube Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true

  # 2. Build and Test Web App
  web_build_test:
    name: React Web Build & Test
    runs-on: ubuntu-latest
    needs: security_scans
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run Tests
        run: npm test -- --watchAll=false
        continue-on-error: true

      - name: Build Web App
        run: npm run build

      - name: Build and Lint Backend Server
        run: |
          npx esbuild server.ts --bundle --platform=node --format=cjs --packages=external --outfile=dist/server.cjs

  # 3. Build Flutter Mobile App
  flutter_build:
    name: Flutter Mobile Build
    runs-on: ubuntu-latest
    needs: security_scans
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Flutter Dependencies
        run: flutter pub get
        working-directory: ./flutter
        continue-on-error: true

      - name: Build Android APK
        run: flutter build apk --release
        working-directory: ./flutter
        continue-on-error: true

  # 4. Deploy to Firebase & Cloud Run
  deploy:
    name: Secure Automated Deployment
    runs-on: ubuntu-latest
    needs: [web_build_test, flutter_build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy Firebase Rules and Indexes
        uses: w9jds/firebase-action@v2.2.0
        with:
          args: deploy --only firestore:rules,firestore:indexes
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

      - name: Build Container and Push to Artifact Registry
        run: |
          gcloud auth configure-docker europe-west2-docker.pkg.dev --quiet
          docker build -t europe-west2-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/lingolive/app:${{ github.sha }} .
          docker push europe-west2-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/lingolive/app:${{ github.sha }}
        continue-on-error: true

      - name: Deploy Canary to Cloud Run (Traffic 10%)
        run: |
          gcloud run deploy lingolive-app \
            --image europe-west2-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/lingolive/app:${{ github.sha }} \
            --region europe-west2 \
            --platform managed \
            --no-traffic \
            --tag canary
          
          # Direct 10% of traffic to the new canary release
          gcloud run services update-traffic lingolive-app --region europe-west2 --to-tags canary=10
        continue-on-error: true
