name: LingoLIVE DevSecOps Pipeline

permissions: {}

# Aciona em cada push/PR para main e develop, conforme LCSS DevSecOps spec
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Forçar deploy mesmo fora de main (uso excecional)"
        type: boolean
        default: false

# Evita execuções concorrentes do mesmo branch a pisarem-se mutuamente
concurrency:
  group: devsecops-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  # ==========================================================================
  # FASE 1 — Security & Quality Audit (SAST/DAST & Credentials)
  # ==========================================================================
  security-audit:
    name: "Fase 1 — Auditoria de Segurança e Qualidade"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: "Verificar disponibilidade do SONAR_TOKEN (sem expor o valor)"
        run: echo "SONAR_TOKEN_SET=${{ secrets.SONAR_TOKEN != '' }}" >> "$GITHUB_ENV"

      - name: Checkout (histórico completo para o Gitleaks analisar commits antigos)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "Gitleaks — Deteção de segredos/chaves expostas no histórico"
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Opcional: licença Gitleaks Pro. Sem ela, corre a versão open-source
          # (suficiente para deteção standard de segredos).
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: "Snyk — Scan de vulnerabilidades (CVEs) em dependências npm"
        uses: snyk/actions/node@12140f4059e244892ae643824a95459a102120dd # master
        continue-on-error: true # Não bloqueia o pipeline em vulnerabilidades de severidade baixa/média; falhas altas são reportadas no summary
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      - name: "SonarCloud — Qualidade de código, cobertura e code smells"
        if: ${{ env.SONAR_TOKEN_SET == 'true' }}
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ==========================================================================
  # FASE 2 — React Web Compilation & Testing
  # ==========================================================================
  build-and-test:
    name: "Fase 2 — Build e Testes (React + Backend)"
    runs-on: ubuntu-latest
    needs: security-audit
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Instalação segura (npm ci)
        run: npm ci

      - name: Lint estrito (verificação de tipos TypeScript)
        run: npm run lint

      - name: Testes unitários e de integração (Vitest)
        run: npx vitest run

      - name: Build de produção (frontend Vite + backend esbuild)
        run: npm run build

      - name: Guardar artefacto de build (para a fase de deploy)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-build
          path: dist/
          retention-days: 7

  # ==========================================================================
  # FASE 3 — Flutter Multiplatform Mobile Compilation
  # Condicional: só corre se existir um projeto Flutter real (pubspec.yaml).
  # Hoje o diretório flutter/ tem apenas ficheiros .dart soltos, sem projeto
  # Flutter inicializado — esta fase fica pronta para quando isso mudar.
  # ==========================================================================
  mobile-build:
    name: "Fase 3 — Build Mobile (Flutter)"
    runs-on: ubuntu-latest
    needs: security-audit
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verificar se existe projeto Flutter inicializado
        id: check_flutter
        run: |
          if [ -f "flutter/pubspec.yaml" ] || [ -f "pubspec.yaml" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Nenhum pubspec.yaml encontrado — projeto Flutter ainda não foi inicializado. Fase de build mobile ignorada."
          fi

      - name: Setup Java 17
        if: steps.check_flutter.outputs.exists == 'true'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter SDK
        if: steps.check_flutter.outputs.exists == 'true'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"

      - name: Resolver dependências e build do APK
        if: steps.check_flutter.outputs.exists == 'true'
        working-directory: ${{ hashFiles('flutter/pubspec.yaml') != '' && 'flutter' || '.' }}
        run: |
          flutter pub get
          flutter build apk --release

  # ==========================================================================
  # FASE 4 — Secure Cloud Release & Traffic Routing (Canary Deploy)
  # Só corre em push direto a 'main' (nunca em PR), e só se as Fases 1-2
  # tiverem sucesso.
  # ==========================================================================
  deploy:
    name: "Fase 4 — Deploy Seguro (Canary 10% -> 100%)"
    runs-on: ubuntu-latest
    needs: [security-audit, build-and-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    permissions:
      contents: read
      id-token: write # Necessário para autenticação OIDC sem chave estática (Workload Identity Federation)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: "Autenticação no Google Cloud (chave de conta de serviço JSON)"
        id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Configurar autenticação Docker para o Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      - name: "Build e push da imagem Docker"
        run: |
          IMAGE="${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/lingolive/server:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: "Deploy das regras de segurança do Firestore"
        run: |
          npm install -g firebase-tools
          firebase deploy --only firestore:rules --project ${{ secrets.GCP_PROJECT_ID }} --token "${{ secrets.FIREBASE_DEPLOY_TOKEN }}"

      - name: "Canary Deploy — nova revisão SEM tráfego (tag: canary)"
        run: |
          gcloud run deploy lingolive-server \
            --image "$IMAGE" \
            --region ${{ secrets.GCP_REGION }} \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --tag canary \
            --no-traffic \
            --quiet

      - name: "Encaminhar 10% do tráfego para a revisão canary"
        run: |
          gcloud run services update-traffic lingolive-server \
            --region ${{ secrets.GCP_REGION }} \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --to-tags canary=10 \
            --quiet

      - name: "Aguardar janela de observação (15 minutos)"
        run: sleep 900

      - name: "Verificação de saúde pós-canary"
        id: health_check
        run: |
          CANARY_URL=$(gcloud run services describe lingolive-server \
            --region ${{ secrets.GCP_REGION }} \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --format="value(status.traffic[?tag=='canary'].url)" | head -1)
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$CANARY_URL/api/service-health/public" || echo "000")
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Health check da revisão canary falhou (HTTP $STATUS)"
            exit 1
          fi

      - name: "Promover para 100% do tráfego (só se a verificação de saúde passou)"
        if: steps.health_check.outputs.status == '200'
        run: |
          gcloud run services update-traffic lingolive-server \
            --region ${{ secrets.GCP_REGION }} \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --to-latest \
            --quiet

      - name: "ROLLBACK AUTOMÁTICO — reverter para a última revisão estável"
        if: failure()
        run: |
          gcloud run services update-traffic lingolive-server \
            --region ${{ secrets.GCP_REGION }} \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --to-revisions STABLE=100 \
            --quiet || echo "::warning::Rollback automático falhou — requer intervenção manual imediata"

      - name: "Notificação de falha (Slack)"
        if: failure()
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "🚨 *LingoLIVE Deploy Falhou* — commit `${{ github.sha }}` revertido automaticamente para a revisão estável anterior. Ver: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
