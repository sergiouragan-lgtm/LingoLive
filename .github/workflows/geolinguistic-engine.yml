name: GeoLinguistic Engine

on:
  pull_request:
    paths:
      - 'packages/geolinguistic-engine/**'
      - '.github/workflows/geolinguistic-engine.yml'
  push:
    branches: [main]
    paths:
      - 'packages/geolinguistic-engine/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/geolinguistic-engine
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
