name: GeoLinguistic Engine

on:
  pull_request:
    paths:
      - 'packages/geolinguistic-engine/**'
      - '.github/workflows/geolinguistic-engine.yml'
  push:
    branches: [main]
    paths:
      - 'packages/geolinguistic-engine/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/geolinguistic-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/geolinguistic-engine/package-lock.json
      - run: npm install --package-lock-only
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
