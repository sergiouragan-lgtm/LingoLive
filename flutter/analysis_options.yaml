include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Protótipos históricos preservados apenas como referência visual.
    - conversation_wizard.dart
    - profile_view.dart
    - sidebar_navigation.dart
    - build/**
    - android/**
    - ios/**

linter:
  rules:
    avoid_print: true
    prefer_const_constructors: true
    curly_braces_in_flow_control_structures: false
