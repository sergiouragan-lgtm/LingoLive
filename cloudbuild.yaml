# Cloud Build CI/CD Pipeline Configuration
steps:
  # Step 1: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/lingolive-server:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/lingolive-server:latest'
      - '.'
    env:
      - 'DOCKER_BUILDKIT=1'

  # Step 2: Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/lingolive-server:$COMMIT_SHA'

  # Step 3: Run tests in container
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'run'
      - '--rm'
      - 'gcr.io/$PROJECT_ID/lingolive-server:$COMMIT_SHA'
      - 'npm'
      - 'run'
      - 'test:ci'

  # Step 4: Deploy to Cloud Run (staging)
  - name: 'gcr.io/cloud-builders/run'
    args:
      - 'deploy'
      - 'lingolive-server-staging'
      - '--image'
      - 'gcr.io/$PROJECT_ID/lingolive-server:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--timeout'
      - '3600'
      - '--set-env-vars'
      - 'NODE_ENV=staging'

images:
  - 'gcr.io/$PROJECT_ID/lingolive-server:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/lingolive-server:latest'

timeout: '3600s'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'N1_HIGHCPU_8'
